name: Release

# Push a tag like v0.1.0 to build the Windows installer and publish a release.
# Run manually to get the installer as a workflow artifact without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm tauri build
        env:
          # Optional. Without them, users paste their own OAuth client in Settings.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v7
        with:
          name: calshell-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          body: |
            **Install:** download `Calshell_*_x64-setup.exe` below and run it. It installs per user, no admin needed.

            The installer is not code-signed yet. If SmartScreen says "Windows protected your PC", click **More info → Run anyway**.

            For tray events, quick add and notifications, create a Google OAuth client and paste it in Settings. See the [setup guide](https://github.com/Snesseye/calshell#1-create-a-google-cloud-oauth-client).
